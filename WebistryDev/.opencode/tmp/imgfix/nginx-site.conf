server {
    server_name ahmedelakad.com www.ahmedelakad.com;
    if ($host = www.ahmedelakad.com) { return 308 https://ahmedelakad.com$request_uri; }

    client_max_body_size 110m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

        # Serve voice note audio files directly
    location /voices/ {
        alias /home/sherif/data/ahmed-elakad/voices/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Serve local media files directly — bypasses Next.js, cached 1 year
    location /media/ {
        alias /home/sherif/sites/Ahmed-Elakad/public/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Authenticated streamed originals: bound request size, no proxy body buffering.
    location = /api/upload/local {
        client_max_body_size 100m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API media: id+width variants are immutable — cache 1 year in the browser
    location ^~ /api/media/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header cache-control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ahmedelakad.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ahmedelakad.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.ahmedelakad.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ahmedelakad.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ahmedelakad.com www.ahmedelakad.com;
    return 404; # managed by Certbot




}
