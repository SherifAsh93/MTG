limit_req_zone $binary_remote_addr zone=opencode_rl:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name opencode.76.13.42.219.nip.io;

    ssl_certificate /etc/letsencrypt/live/opencode.76.13.42.219.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencode.76.13.42.219.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        limit_req zone=opencode_rl burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name opencode.76.13.42.219.nip.io;
    return 301 https://$host$request_uri;
}
